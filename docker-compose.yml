services:
  tim-backend:
    build: ./tim-backend
    container_name: tim-backend
    ports:
      - "8080:8080"
    depends_on:
      - minio

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
